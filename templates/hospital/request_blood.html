{% extends "hospital/base_hospital.html" %}
{% block title %}New blood request | PulseBridge{% endblock %}
{% block content %}
<div class="container-fluid"><div class="row justify-content-center"><div class="col-lg-8"><div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h3 text-danger">New blood request</h1><a href="{% url 'hospital:availability' %}" class="btn btn-outline-danger">Check inventory</a></div><div class="card border-0 shadow-sm"><div class="card-body p-4"><p class="text-muted">Requests are created for City Hospital and appear immediately on the dashboard.</p><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label" for="blood_group">Blood group</label><select class="form-select" name="blood_group" id="blood_group" required><option value="">Select group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div><div class="col-md-6"><label class="form-label" for="component_type">Component</label><select class="form-select" name="component_type" id="component_type" required><option value="RBC">Red blood cells</option><option value="PLT">Platelets</option><option value="PLS">Plasma</option></select></div><div class="col-md-6"><label class="form-label" for="units_needed">Units needed</label><input class="form-control" type="number" name="units_needed" id="units_needed" min="1" max="50" required></div><div class="col-md-6"><label class="form-label" for="urgency">Urgency</label><select class="form-select" name="urgency" id="urgency"><option value="NORMAL">Normal</option><option value="EMERGENCY">Emergency</option></select></div></div><button class="btn btn-danger mt-4">Submit request</button></form></div></div></div></div></div>
{% endblock %}
