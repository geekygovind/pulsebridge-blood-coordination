{% extends "blood_bank/index.html" %}
{% block title %}Add inventory | PulseBridge{% endblock %}
{% block content %}
<div class="form-box"><h2>Add blood inventory</h2>{% if not banks %}<p>Add a blood bank in the Django admin before entering inventory.</p>{% else %}<form method="post">{% csrf_token %}<div class="form-group"><label for="blood_bank">Blood bank</label><select name="blood_bank" id="blood_bank" required><option value="">Select a blood bank</option>{% for bank in banks %}<option value="{{ bank.id }}">{{ bank.name }} — {{ bank.city }}</option>{% endfor %}</select></div><div class="form-group"><label for="blood_group">Blood group</label><select name="blood_group" id="blood_group" required><option value="A+">A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div><div class="form-group"><label for="component_type">Component</label><select name="component_type" id="component_type"><option value="RBC">Red blood cells</option><option value="PLT">Platelets</option><option value="PLS">Plasma</option></select></div><div class="form-group"><label for="units">Units</label><input type="number" name="units" id="units" min="1" required></div><div class="form-group"><label for="donation_date">Donation date</label><input type="date" name="donation_date" id="donation_date" max="{{ today }}" required></div><div class="form-group"><label for="expiry_date">Expiry date</label><input type="date" name="expiry_date" id="expiry_date" required></div><div class="form-group"><label for="status">Status</label><select name="status" id="status"><option value="AVAILABLE">Available</option><option value="RESERVED">Reserved</option><option value="USED">Used</option><option value="EXPIRED">Expired</option></select></div><button class="btn">Save inventory</button></form>{% endif %}</div>
{% endblock %}
