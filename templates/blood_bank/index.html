<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{% block title %}Blood bank | PulseBridge{% endblock %}</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#fff8f7;color:#26313b;font-family:Arial,sans-serif}.container{width:min(1100px,calc(100% - 36px));margin:auto}header{background:#17212b;padding:16px 0}.nav-container{align-items:center;display:flex;justify-content:space-between;gap:20px}.logo{color:#fff;display:flex;align-items:center;gap:10px}.logo i{color:#ff94a1;font-size:24px}.logo h1{font-size:20px;margin:0}nav ul{display:flex;gap:20px;list-style:none;margin:0;padding:0}nav a{color:#e9eef1;text-decoration:none;font-weight:bold}nav a:hover,nav a.active{color:#ff94a1}.main-content{min-height:70vh;padding:42px 0}.welcome-section,.card,.section,.form-box{background:#fff;border-radius:14px;box-shadow:0 8px 25px rgba(33,43,54,.08);padding:28px}.welcome-section{border-left:4px solid #d94b5b;margin-bottom:24px}.dashboard-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.card{border-top:3px solid #d94b5b}.card-icon{color:#d94b5b;font-size:26px}.card-btn,.btn{background:#d94b5b;border:0;border-radius:7px;color:#fff;cursor:pointer;display:inline-block;margin-top:16px;padding:10px 15px;text-decoration:none}.form-box{max-width:560px;margin:auto}.form-group{margin:16px 0}.form-group label{display:block;font-weight:bold;margin-bottom:6px}.form-group input,.form-group select,.form-group textarea{border:1px solid #ccd2d8;border-radius:7px;padding:11px;width:100%}.message{border-radius:8px;margin:0 0 18px;padding:12px}.message.success{background:#e5f5ee;color:#14683d}.message.error{background:#fff0f1;color:#a92134}.message.info{background:#eaf3ff;color:#15599d}table th,table td{border-bottom:1px solid #eee;padding:12px;text-align:left}footer{background:#17212b;color:#dbe3e7;padding:28px 0;text-align:center}@media(max-width:650px){.nav-container{align-items:flex-start;flex-direction:column}nav ul{flex-wrap:wrap}}
</style></head><body><header><div class="container nav-container"><div class="logo"><i class="fa-solid fa-droplet"></i><h1>PulseBridge · Blood bank</h1></div><nav><ul><li><a class="{% if active_page == 'home' %}active{% endif %}" href="{% url 'blood_bank:home' %}">Dashboard</a></li><li><a class="{% if active_page == 'availability' %}active{% endif %}" href="{% url 'blood_bank:availability' %}">Inventory search</a></li><li><a class="{% if active_page == 'update' %}active{% endif %}" href="{% url 'blood_bank:update' %}">Add inventory</a></li><li><a href="{% url 'landing' %}">Main site</a></li><li><a href="{% url 'admin:index' %}">Admin panel</a></li></ul></nav></div></header><main class="container main-content">{% if messages %}{% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main><footer><div class="container">Created by Govind Singh · 2026</div></footer></body></html>
