{% extends "blood_bank/index.html" %}

{% block title %}Patient Login - HealthCare{% endblock %}

{% block content %}
<div class="section">
    <h2>Blood_Bank Registration</h2>
    <div class="login-form">
        <form action="" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Patient Name</label>
                <input type="text" id="username" placeholder="Enter your Name" required>
            </div>
            
            <div class="form-group">
               <label for="area">Area:</label><br>
                <textarea id="area" name="area" placeholder="Enter your area"></textarea>

             </div>
             <div class="form-group">
                <label for="city">City:</label>
                <input type="text" id="city" placeholder="Enter your City" required>
            </div>   
            <div class="form-group">
                <label for="contact">Contact:</label>
                <input type="text" id="contact" placeholder="Enter your Contact Number " required>    
            </div>
             <div class="form-group">
               <label for="password">Password :</label><br>
                <input type="password" id="password" placeholder="Enter your Password" required>
             </div>     
            
            <button type="submit" class="submit-btn">Register</button>

            {% if messages %}
            {% for message in messages %}
            <p style="color:red;text-align:center;margin-top: 20px;">{{ message }}</p>
           {% endfor %}
             {% endif %}
            
          
        </form>
    </div>
</div>
{% endblock %}
