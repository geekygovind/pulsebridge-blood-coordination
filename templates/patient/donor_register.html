{% extends "patient/index.html" %}
{% block title %}Become a donor | PulseBridge{% endblock %}
{% block content %}
<div class="section"><h2><i class="fas fa-heart"></i> Become a blood donor</h2><p>Register your details so the care network can contact you when your blood group is needed.</p><div class="login-form"><form method="post">{% csrf_token %}<div class="form-group"><label for="name">Full name</label><input name="name" id="name" required></div><div class="form-group"><label for="blood_group">Blood group</label><select name="blood_group" id="blood_group" required><option value="">Select blood group</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div><div class="form-group"><label for="city">City</label><input name="city" id="city" required></div><div class="form-group"><label for="contact">Contact number</label><input name="contact" id="contact" inputmode="tel" required></div><div class="form-group"><label for="last_donation_date">Last donation date <small>(optional)</small></label><input type="date" name="last_donation_date" id="last_donation_date"></div><button class="submit-btn">Register as a donor</button></form></div></div>
{% endblock %}
