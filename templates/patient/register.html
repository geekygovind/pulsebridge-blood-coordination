{% extends "patient/index.html" %}
{% block title %}Register | PulseBridge{% endblock %}
{% block content %}
<div class="section"><h2>Create a patient account</h2><div class="login-form"><form method="post">{% csrf_token %}<div class="form-group"><label for="name">Name</label><input name="name" id="name" required></div><div class="form-group"><label for="area">Area</label><input name="area" id="area" required></div><div class="form-group"><label for="city">City</label><input name="city" id="city" required></div><div class="form-group"><label for="contact">Contact number</label><input name="contact" id="contact" inputmode="tel" required></div><div class="form-group"><label for="password">Password</label><input type="password" name="password" id="password" minlength="8" required></div><button type="submit" class="submit-btn">Create account</button><p style="margin-top:20px;text-align:center">Already registered? <a href="{% url 'patient:login' %}">Sign in</a></p></form></div></div>
{% endblock %}
