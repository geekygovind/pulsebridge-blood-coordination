{% extends "patient/index.html" %}
{% block title %}Sign in | PulseBridge{% endblock %}
{% block content %}
<div class="section"><h2>Patient sign in</h2><div class="login-form"><form action="{% url 'patient:verify' %}" method="post">{% csrf_token %}<div class="form-group"><label for="username">Name</label><input name="username" id="username" autocomplete="username" required></div><div class="form-group"><label for="password">Password</label><input type="password" name="password" id="password" autocomplete="current-password" required></div><button type="submit" class="submit-btn">Sign in</button><p style="margin-top:20px;text-align:center">New here? <a href="{% url 'patient:register' %}">Create an account</a></p></form></div></div>
{% endblock %}
